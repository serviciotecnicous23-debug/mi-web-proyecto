<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="robots" content="noindex" />
  <title>Sin conexión — Avivando el Fuego</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff7ed;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(124, 58, 237, 0.28), transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(249, 115, 22, 0.22), transparent 55%),
        #0a0a0f;
    }
    main { max-width: 22rem; text-align: center; }
    .flame {
      width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.35), transparent 70%);
      animation: breathe 2.8s ease-in-out infinite;
    }
    .flame img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: 0.02em; }
    p { margin: 0 0 24px; line-height: 1.5; color: rgba(255, 237, 213, 0.78); }
    button {
      min-height: 48px; padding: 0 28px; border: 0; border-radius: 9999px; cursor: pointer;
      font: inherit; font-weight: 700; color: #16060a;
      background: linear-gradient(135deg, #fbbf24, #f97316 55%, #dc2626);
      box-shadow: 0 10px 28px rgba(249, 115, 22, 0.4);
    }
    button:focus-visible { outline: 2px solid #fdba74; outline-offset: 3px; }
    small { display: block; margin-top: 16px; color: rgba(255, 237, 213, 0.55); }
    @keyframes breathe { 50% { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { .flame { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="flame"><img src="/icons/maskable-192.png" alt="" /></div>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Cuando vuelva la señal, la página se abre sola.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <small>Ministerio Avivando el Fuego</small>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
